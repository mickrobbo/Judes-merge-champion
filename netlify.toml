# The game is one file (index.html at the repo root, which GitHub Pages serves too).
# Netlify copies the game, app manifest, offline helper and icons into public/
# so server code and node_modules are never published.
[build]
  command = "mkdir -p public && cp index.html manifest.webmanifest sw.js public/ && cp -r icons brand public/"
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
